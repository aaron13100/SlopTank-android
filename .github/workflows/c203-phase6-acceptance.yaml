name: c203 / Phase 6 device acceptance

# Manual only. Runs the Phase 6 offline acceptance sequence (docs/sloptank-c203/TASK.md) on an emulator
# against a throwaway SlopTank server built from SlopTank-server with generated media:
# download online, airplane mode, kill, browse Downloads, play, seek, switch audio and subtitles, finish,
# reconnect, progress synced exactly once. See scripts/c203-phase6/ and
# app/src/androidTest/java/org/jellyfin/mobile/acceptance/.
on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: SlopTank-server branch, tag or commit that serves the playback progress receipts API
        default: c203-progress-receipts
        required: true
      api_level:
        description: Emulator API level (google_apis, x86_64)
        default: "34"
        required: true

permissions:
  contents: read

jobs:
  phase6:
    name: Phase 6 device acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout SlopTank-server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aaron13100/SlopTank-server
          ref: ${{ inputs.server_ref }}
          path: sloptank-server
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: sloptank-server/global.json
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sqlite3 jq
      - name: Build server
        run: dotnet publish sloptank-server/Jellyfin.Server -c Release -o "$RUNNER_TEMP/server"
      - name: Start throwaway server with generated media
        run: |
          scripts/c203-phase6/server-fixture.sh "$RUNNER_TEMP/server" "$RUNNER_TEMP/c203" "$RUNNER_TEMP/c203.env"
          . "$RUNNER_TEMP/c203.env"
          echo "::add-mask::$C203_PASSWORD"
          cat "$RUNNER_TEMP/c203.env" >> "$GITHUB_ENV"
      - name: Build app and acceptance test APKs
        run: ./gradlew assembleLibreDebug assembleLibreDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Phase 6 sequence on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          C203_LOGCAT_OUT: ${{ runner.temp }}/logcat.txt
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r -t "$(find app/build/outputs/apk/libre/debug -name '*-libre-debug.apk' | head -1)"
            adb install -r -t "$(find app/build/outputs/apk/androidTest -name '*-androidTest.apk' | head -1)"
            scripts/c203-phase6/run-device-sequence.sh http://10.0.2.2:8096 "$C203_USER" "$C203_PASSWORD" "$C203_ITEM_ID"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c203-phase6-logs
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/c203/server.log
